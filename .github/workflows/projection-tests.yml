name: Projection metric toy tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "research/annoctr_sampling/**"
      - "research/schema_reconstruction/**"
      - "data/processed/annoctr_screening/**"
      - "docs/PROJECT_STATE.md"
      - ".github/workflows/projection-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "research/annoctr_sampling/**"
      - "research/schema_reconstruction/**"
      - "data/processed/annoctr_screening/**"
      - "docs/PROJECT_STATE.md"
      - ".github/workflows/projection-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Smoke-test synthetic projection demo
        run: python -m examples.toy_projection_demo
      - name: Verify reconstructed schema package checksums
        working-directory: research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.1
        run: sha256sum --check SHA256SUMS.txt
      - name: Run reconstructed schema/projection synthetic tests
        working-directory: research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.1
        run: python -m unittest discover -s tests -v
      - name: Validate blank reconstructed annotation bundle
        working-directory: research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.1
        run: python validator/validate_annotations.py --bundle .
      - name: Run temporal evidence extension synthetic tests
        run: python -m unittest discover -s research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.2/tests -v
      - name: Validate blank temporal evidence extension
        run: python research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.2/validator/validate_temporal_evidence.py --base-bundle research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.1 --evidence-file research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.2/registers/temporal_relation_evidence.csv
      - name: Validate blank final analysis partition register
        run: python research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.2/validator/validate_temporal_evidence.py --base-bundle research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.1 --evidence-file research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.2/registers/temporal_relation_evidence.csv --selection-file research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.2/registers/analysis_partition_selection.csv
      - name: Run explicit comparison-scope extension synthetic tests
        run: python -m unittest discover -s research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.3/tests -v
      - name: Validate blank explicit comparison-scope extension
        run: python research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.3/validator/validate_comparison_scope_assignments.py --base-bundle research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.1 --v2-extension research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.2 --assignment-file research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.3/registers/event_comparison_scope_assignments.csv --lock-file research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.3/registers/comparison_scope_assignment_locks.csv
      - name: Run activity-stratum extension synthetic tests
        run: python -m unittest discover -s research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.4/tests -v
      - name: Validate blank activity-stratum extension and lock register
        run: python research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.4/validator/validate_activity_strata.py --base-bundle research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.1 --strata-file research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.4/registers/activity_unit_strata.csv --selection-file research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.2/registers/analysis_partition_selection.csv --lock-file research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.4/registers/activity_stratum_locks.csv
      - name: Package the tested source snapshot
        run: git archive --format=zip --prefix=cti-evidence-lab/ HEAD > cti-evidence-lab-main.zip
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cti-evidence-lab-source-${{ github.sha }}
          path: cti-evidence-lab-main.zip
          if-no-files-found: error
          retention-days: 14
