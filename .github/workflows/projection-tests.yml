name: Projection metric toy tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "research/annoctr_sampling/**"
      - "research/schema_reconstruction/**"
      - "data/processed/annoctr_screening/**"
      - "docs/PROJECT_STATE.md"
      - ".github/workflows/projection-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "research/annoctr_sampling/**"
      - "research/schema_reconstruction/**"
      - "data/processed/annoctr_screening/**"
      - "docs/PROJECT_STATE.md"
      - ".github/workflows/projection-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Smoke-test synthetic projection demo
        run: python -m examples.toy_projection_demo
      - name: Verify reconstructed schema package checksums
        working-directory: research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.1
        run: sha256sum --check SHA256SUMS.txt
      - name: Run reconstructed schema/projection synthetic tests
        working-directory: research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.1
        run: python -m unittest discover -s tests -v
      - name: Validate blank reconstructed annotation bundle
        working-directory: research/schema_reconstruction/CTI_Annotation_Schema_RECON_v0.1
        run: python validator/validate_annotations.py --bundle .
